[package]
name = "agent"
description = "持有一段持续对话的 agent 会话：四端口注入，请求边界信箱投递"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

# 通用模块：零项目依赖，目录可整体拷出独立构建。
[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
