[package]
name = "agent"
description = "Provider-neutral agent kernel with batch tool dispatch and boundary mailboxes"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
# 共享 HTTP transport；协议 feature 会自动启用它。
http = ["dep:reqwest"]
# OpenAI Chat Completions 与 Responses API。
openai = ["http"]
# Anthropic Messages API。
anthropic = ["http"]
# 构建当前提供的全部正式协议 adapter。
all-adapters = ["openai", "anthropic"]

[dependencies]
reqwest = { version = "0.13", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[[example]]
name = "protocol_smoke"
path = "examples/protocol-smoke/main.rs"
test = true
required-features = ["all-adapters"]
