[package]
name = "agent"
description = "Provider-neutral agent kernel with batch tool dispatch and boundary mailboxes"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[[example]]
name = "protocol_smoke"
path = "examples/protocol-smoke/main.rs"
test = true
