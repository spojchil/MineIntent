[package]
name = "mineintent-app"
version = "0.0.1"
edition = "2021"
description = "MineIntent 组合根：装配 backend、Participant runtime 与模型 provider"
publish = false

[[bin]]
name = "mineintent"
path = "src/main.rs"

[dependencies]
# 纵向假人 bin 直用 Azalea（与 backend 同一 pin）；产品路径不直接触协议。
azalea = { version = "=0.16.0", default-features = false, features = ["log"] }
mineintent-backend = { path = "../backend" }
mineintent-contracts = { path = "../contracts" }
mineintent-middle = { path = "../middle" }
parking_lot = "0.12"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
