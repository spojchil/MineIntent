[package]
name = "mineintent-app"
version = "0.0.1"
edition = "2021"
description = "MineIntent 组合根：装配 backend、Participant runtime 与模型 provider"
publish = false

[[bin]]
name = "mineintent"
path = "src/main.rs"

[dependencies]
mineintent-backend = { path = "../backend" }
mineintent-contracts = { path = "../contracts" }
mineintent-middle = { path = "../middle" }
parking_lot = "0.12"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
