[package]
name = "companion"
description = "组合根：纵切装配——接入模块+编排+界面+记忆+上下文+最小唤醒脚手架"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
bridge = { path = "../bridge" }
# 文件名与对话记录里的本地时间。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
agent = { workspace = true, features = ["openai", "anthropic"] }
context = { path = "../context" }
dispatch = { path = "../dispatch" }
# 控制台分流进 logs/latest.log：在文件描述符层接管 stdout/stderr，跨平台。
filedescriptor = "0.8"
hand = { path = "../hand" }
input = { path = "../input" }
jobs = { path = "../jobs" }
perception = { path = "../perception" }
presence = { path = "../presence" }
memory = { path = "../memory" }
render = { path = "../render" }
# 首次使用时从 Mojang 官方下载客户端 JAR（见 src/client_jar.rs）；与 midturn 的声明一致，不引入新依赖。
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
sha1 = "0.11"
screens = { path = "../screens" }
wait = { path = "../wait" }
vision = { path = "../vision" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
world = { path = "../world", features = ["azalea"] }

[lints]
workspace = true

# 超时探针：不依赖 azalea，只打 HTTP 适配器这一层。
[[example]]
name = "model_timeout_probe"
