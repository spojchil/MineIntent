[package]
name = "perception"
description = "感知：视口扫描工具（Free 类薄壳），几何在接入模块的视口内核"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
agent = { workspace = true }
dispatch = { path = "../dispatch" }
render = { path = "../render" }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde_json = "1"
world = { path = "../world" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
