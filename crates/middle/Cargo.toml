[package]
name = "mineintent-middle"
version = "0.0.1"
edition = "2021"
description = "MineIntent 中间层与 Agent 循环骨架"
publish = false

[dependencies]
mineintent-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
