[package]
name = "mineintent-middle"
version = "0.0.1"
edition = "2021"
description = "MineIntent 进程内事件、执行、信息与语音协调层"
publish = false

[dependencies]
mineintent-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "rt-multi-thread", "test-util"] }
