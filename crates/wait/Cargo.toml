[package]
name = "wait"
description = "让时间过去：什么都不做，但有事发生就立刻醒"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
agent = { workspace = true }
dispatch = { path = "../dispatch" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
