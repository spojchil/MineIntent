version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
agent = { package = "midturn", path = "../agent" }
memory = { path = "../memory" }
render = { path = "../render" }
screens = { path = "../screens" }
serde_json = "1"
world = { path = "../world" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
