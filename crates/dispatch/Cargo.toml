[package]
name = "dispatch"
description = "工具编排：供应者注册、按名路由、界面压制，实现内核的整批与增量两条执行路径"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
agent = { package = "midturn", path = "../agent" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
