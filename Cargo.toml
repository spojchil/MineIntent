[workspace]
members = [
    "crates/app",
    "crates/backend",
    "crates/contracts",
    "crates/middle",
    "crates/toolloop",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spojchil/MineIntent"
publish = false

[workspace.dependencies]
mineintent-backend = { path = "crates/backend" }
mineintent-contracts = { path = "crates/contracts" }
mineintent-middle = { path = "crates/middle" }
# 领域无关的模型—工具循环。名字不带 mineintent 是有意的：它不该知道自己在哪个项目里。
toolloop = { path = "crates/toolloop" }

# 自有 fork：为每次 join 尝试铸不可变 AttemptToken 并支持 pre-Init 精确取消。
# 补丁内容与理由见 crates/backend/README.md；rev 钉死，升级须同时更新该说明。
azalea = { git = "https://github.com/spojchil/azalea", rev = "d0cc847fa3c9e0d448e42b9636c7bd8684c5aa08", default-features = false, features = [
    "log",
] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
parking_lot = "0.12"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# 排障日志：分级 + 按模块过滤。与 journal 分工不同——journal 是产品事实的
# 持久记录，这里是可丢弃的过程记录（OTel OTEP-0202 的 severity/name 之分）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1" }
uuid = { version = "1", features = ["serde", "v4"] }

# 发版配置：目标是可分发的单文件，同时保住两条不能被体积优化掉的行为
#（排障靠 dev.log/journal 而非符号表；panic 的接管层依赖 unwind）。
[profile.release]
# 跨 crate 内联：bevy/azalea 的泛型与小函数极多，整体 LTO 收益最大。
lto = "fat"
# 单编译单元换取更好的跨模块优化；构建变慢，分发体积与运行时更优。
codegen-units = 1
# 去符号表与调试信息：体积的大头。排障靠开发者模式的 dev.log 与 journal，
# 不依赖发版二进制里的符号（需要栈回溯时用 debug 构建复现）。
strip = "symbols"
# 显式保留 unwind。理由换过一次，写全以免再被当成性能选择：
#
# 旧理由（已作废）是「工具与 provider 的 panic 由 agent/driver.rs 的
# catch_unwind 转成结构化失败」。那些捕获已经全部删除，生产代码里现在零处
# catch_unwind——依据见 toolloop/src/control.rs 开头。
#
# 现在的理由是：删掉捕获之后，panic 的接管者换成了 tokio 的任务边界。worker
# 任务 panic 被接成 JoinError，由 participant runtime 的 stop 记成
# participant_worker_panicked；两根不在任务里的裸线程（backend worker 与
# dispatcher）则在各自 join 处出声。改成 abort 会让这整个接管层一起失效，
# 所以它不是改一行的事，得先决定缺陷发生时由谁负责。
panic = "unwind"
# 不用 opt-level="z"：ECS 每秒 20 tick 的热路径对吞吐敏感，
# 拿运行时性能换几 MB 体积不划算。
opt-level = 3

[workspace.lints.rust]
# unsafe 必须逐处显式豁免并写明理由；默认拒绝，不留无人认领的 unsafe。
unsafe_code = "deny"

[workspace.lints.clippy]
# 与既有代码风格一致：字符串字面量统一 to_owned。
str_to_string = "warn"

# 以下四类是已登记的结构性欠账，逐条写明理由而不是整体静音：
# BackendError/AgentError 是宽结构化错误枚举，Err 变体体积大是有意选择——
# 调用方按 code 分类处理需要这些字段；装箱是改公开 API 的重构，
# 留待移植完成、wire 冻结解除时统一处理。
result_large_err = "allow"
large_enum_variant = "allow"
# 准入类函数需要同时携带 client/epoch/命令身份/世代/completion，
# 参数多是「同一准入点必须看到全部身份」的直接后果，拆开反而制造不一致窗口。
too_many_arguments = "allow"
# 契约层的返回类型直接映射 wire 形状，抽 type 别名会让读者多跳一层。
type_complexity = "allow"
