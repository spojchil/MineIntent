[workspace]
members = [
    "crates/bridge",
    "crates/companion",
    "crates/context",
    "crates/dispatch",
    "crates/hand",
    "crates/input",
    "crates/jobs",
    "crates/memory",
    "crates/perception",
    "crates/presence",
    "crates/render",
    "crates/screens",
    "crates/wait",
    "crates/world",
    "crates/vision",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spojchil/MineIntent"
publish = false

[workspace.dependencies]
# 自有 fork（分支 mineintent/keymouse-slim，上游 0.16.0 之上四个补丁）：连接
# AttemptToken；挖掘请求与本地预测可观察（坐标挖掘任务的判定表要用）；键鼠输入
# 撞上的两处协议/控制偏差——攻击包实体 id 按原版编 VarInt（原为定长 i32，服务端
# 踢人），左平移键给 +left_impulse（原为反号）；方块状态号按属性名排序解码（原按
# 数据报告的列出顺序，箱子与活塞头等 12 种方块的 232 个状态解成了错的属性）。
# rev 钉死，升级时在此处记录新 rev 与改动理由。
#
# packet-event 在此统一开启，而不是只由 world 单独要求。理由是 Cargo 对同一
# 次编译中的 feature 取并集：分开声明只会让「构建口径不同、azalea 编出来的
# 东西也不同」，`-p world` 与 `--workspace` 得到两套指纹，来回切就整棵重编。
# 现在只有一个消费者，统一声明既真实又省事。
azalea = { git = "https://github.com/spojchil/azalea", rev = "5323f91389631d73a8f9ab21cdfcf739ca63e554", default-features = false, features = [
    "log",
    "packet-event",
] }
# 聊天组件的翻译参数类型 azalea 没有导出；同一 fork 同一 rev，与 azalea 用的是同一份。
# 升 azalea 的 rev 时这里一起改。
azalea-chat = { git = "https://github.com/spojchil/azalea", rev = "5323f91389631d73a8f9ab21cdfcf739ca63e554" }
# 模型内核（上游独立仓，曾用名 agent/toolturn）。rev 钉死；升级流程：
# 上游更新→本地跑验收（测试+对抗读）→改此处 rev→修下游破口→推送。
# 依赖键保持 `agent`，源码里仍写 `agent::`，改名不惊动下游。
agent = { package = "midturn", git = "https://github.com/spojchil/midturn", rev = "bf8bc7a7126dc2943145b03a0b4a3481de8177e1" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }

# 发版配置：目标是可分发的单文件。
[profile.release]
# 跨 crate 内联：bevy/azalea 的泛型与小函数极多，整体 LTO 收益最大。
lto = "fat"
# 单编译单元换取更好的跨模块优化；构建变慢，分发体积与运行时更优。
codegen-units = 1
# 去符号表与调试信息：体积的大头。需要栈回溯时用 debug 构建复现。
strip = "symbols"
# 显式保留默认 unwind。agent 内核在观测器旁路用 catch_unwind 隔离使用者的
# 观测实现（只读旁路，不改状态）；改成 abort 会让那处隔离静默失效，
# 成为一段永不执行的代码。工具与模型 provider 的 panic 不走捕获——它们由
# 任务边界接成 JoinError 走失败流。
panic = "unwind"
# 不用 opt-level="z"：ECS 每秒 20 tick 的热路径对吞吐敏感，
# 拿运行时性能换几 MB 体积不划算。
opt-level = 3

[workspace.lints.rust]
# unsafe 必须逐处显式豁免并写明理由；默认拒绝，不留无人认领的 unsafe。
unsafe_code = "deny"

[workspace.lints.clippy]
# 与既有代码风格一致：字符串字面量统一 to_owned。
str_to_string = "warn"
