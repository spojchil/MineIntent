[workspace]
members = [
    "crates/companion",
    "crates/context",
    "crates/dispatch",
    "crates/hand",
    "crates/jobs",
    "crates/memory",
    "crates/motion",
    "crates/perception",
    "crates/presence",
    "crates/render",
    "crates/screens",
    "crates/wait",
    "crates/world",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spojchil/MineIntent"
publish = false

[workspace.dependencies]
# 自有 fork：除连接 AttemptToken 外，还提供 generation-safe pathfinder lifecycle、
# 可关闭 partial 自动续算的选项、严格未知方块 fallback、采掘成本观察一致性，
# 以及 Movement 的精确副作用清单。当前 MineIntent 仍关闭自动采掘；这些端口是
# 后续把走 / 挖 / 放收进同一条受策略约束路径的基础设施。
# rev 钉死，升级时在此处记录新 rev 与改动理由。
#
# packet-event 在此统一开启，而不是只由 world 单独要求。理由是 Cargo 对同一
# 次编译中的 feature 取并集：分开声明只会让「构建口径不同、azalea 编出来的
# 东西也不同」，`-p world` 与 `--workspace` 得到两套指纹，来回切就整棵重编。
# 现在只有一个消费者，统一声明既真实又省事。
azalea = { git = "https://github.com/spojchil/azalea", rev = "42cff2fb4fa4d9b72bc0245d491351128a8227a2", default-features = false, features = [
    "log",
    "packet-event",
] }
# 模型内核（上游独立仓，曾用名 agent/toolturn）。rev 钉死；升级流程：
# 上游更新→本地跑验收（测试+对抗读）→改此处 rev→修下游破口→推送。
# 依赖键保持 `agent`，源码里仍写 `agent::`，改名不惊动下游。
agent = { package = "midturn", git = "https://github.com/spojchil/midturn", rev = "ddc6e63377775fc4f71a6cbb4d052adc67073f6a" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }

# 发版配置：目标是可分发的单文件。
[profile.release]
# 跨 crate 内联：bevy/azalea 的泛型与小函数极多，整体 LTO 收益最大。
lto = "fat"
# 单编译单元换取更好的跨模块优化；构建变慢，分发体积与运行时更优。
codegen-units = 1
# 去符号表与调试信息：体积的大头。需要栈回溯时用 debug 构建复现。
strip = "symbols"
# 显式保留默认 unwind。agent 内核在观测器旁路用 catch_unwind 隔离使用者的
# 观测实现（只读旁路，不改状态）；改成 abort 会让那处隔离静默失效，
# 成为一段永不执行的代码。工具与模型 provider 的 panic 不走捕获——它们由
# 任务边界接成 JoinError 走失败流。
panic = "unwind"
# 不用 opt-level="z"：ECS 每秒 20 tick 的热路径对吞吐敏感，
# 拿运行时性能换几 MB 体积不划算。
opt-level = 3

[workspace.lints.rust]
# unsafe 必须逐处显式豁免并写明理由；默认拒绝，不留无人认领的 unsafe。
unsafe_code = "deny"

[workspace.lints.clippy]
# 与既有代码风格一致：字符串字面量统一 to_owned。
str_to_string = "warn"
